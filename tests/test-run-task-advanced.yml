name: Test run-task advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal ECS task definition file
        run: |
          cat > /tmp/run-task-advanced-def.json << 'EOF'
          {
            "family": "test-run-task-advanced",
            "containerDefinitions": [
              {
                "name": "test-container",
                "image": "busybox:latest",
                "cpu": 256,
                "memory": 512,
                "essential": true,
                "command": ["echo", "hello"]
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "networkMode": "awsvpc",
            "cpu": "256",
            "memory": "512"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/run-task-advanced-def.json
          run-task: "true"
          run-task-container-overrides: '[{"name":"test-container","command":["echo","overridden"]}]'
          run-task-security-groups: sg-00000000000000001
          run-task-subnets: subnet-00000000000000001
          run-task-assign-public-IP: DISABLED
          run-task-capacity-provider-strategy: '[{"capacityProvider":"FARGATE_SPOT","weight":1}]'
          run-task-tags: '[{"key":"Environment","value":"test"}]'
          run-task-managed-ebs-volume-name: my-ebs-volume
          run-task-managed-ebs-volume: '{"sizeInGiB":20,"volumeType":"gp3"}'
          wait-for-task-stopped: "false"

      - name: Assert action ran (succeeded with AWS creds, or failed gracefully without)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_DEF_ARN: ${{ steps.action.outputs.task-definition-arn }}
          RUN_TASK_ARN: ${{ steps.action.outputs.run-task-arn }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition-arn: $TASK_DEF_ARN"
          echo "run-task-arn: $RUN_TASK_ARN"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_ARN" ]; then
              echo "FAIL: action succeeded but task-definition-arn output is empty"
              exit 1
            fi
            echo "PASS: task registered and run with advanced options, ARN=$TASK_DEF_ARN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
