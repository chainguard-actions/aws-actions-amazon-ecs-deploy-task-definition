name: Test register task definition (no service)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: fake-key-id
      AWS_SECRET_ACCESS_KEY: fake-secret-key
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid task definition file and no service
        id: action
        uses: .
        with:
          task-definition: tests/fixtures/task-definition.json
        continue-on-error: true

      - name: Assert action failed at AWS API (not at file parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because we have fake AWS credentials,
          # but it should NOT fail due to file-not-found or parse errors.
          # The failure should come from the ECS registerTaskDefinition API call.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no real AWS credentials)"
            exit 1
          fi
          echo "PASS: action failed at AWS API call as expected (task definition file was read and parsed successfully)"
