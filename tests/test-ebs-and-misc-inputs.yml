name: Test ECS deploy - EBS volume and misc inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create task definition file with EBS volume
        run: |
          cat > /tmp/ebs-task-def.json << 'EOF'
          {
            "family": "test-ebs-task",
            "containerDefinitions": [
              {
                "name": "web",
                "image": "nginx:latest",
                "cpu": 256,
                "memory": 512,
                "essential": true,
                "mountPoints": [
                  {
                    "sourceVolume": "my-ebs-volume",
                    "containerPath": "/data",
                    "readOnly": false
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "my-ebs-volume",
                "configuredAtLaunch": true
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "networkMode": "awsvpc",
            "cpu": "256",
            "memory": "512"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/ebs-task-def.json
          service: my-ebs-service
          cluster: my-cluster
          service-managed-ebs-volume-name: my-ebs-volume
          service-managed-ebs-volume: '{"sizeInGiB":20,"volumeType":"gp3","encrypted":true}'
          keep-null-value-keys: "environment,secrets"
          max-retries: "5"
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key

      - name: Assert action ran (EBS and misc inputs, expect graceful failure without real AWS creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_DEF_ARN: ${{ steps.action.outputs.task-definition-arn }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition-arn: $TASK_DEF_ARN"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_ARN" ]; then
              echo "FAIL: action succeeded but task-definition-arn output is empty"
              exit 1
            fi
            echo "PASS: EBS volume service deployed, ARN=$TASK_DEF_ARN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real AWS credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
