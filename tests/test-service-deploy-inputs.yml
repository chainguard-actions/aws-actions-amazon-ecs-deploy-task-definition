name: Test service deployment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create task definition file
        run: |
          mkdir -p /tmp/test-fixtures
          cat > /tmp/test-fixtures/task-def-service.json << 'EOF'
          {
            "family": "test-service-task-family",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "containerDefinitions": [
              {
                "name": "test-container",
                "image": "nginx:latest",
                "essential": true
              }
            ]
          }
          EOF

      - name: Run action with service deployment inputs
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
        with:
          task-definition: /tmp/test-fixtures/task-def-service.json
          service: my-test-service
          cluster: my-test-cluster
          desired-count: "2"
          wait-for-service-stability: "false"
          wait-for-minutes: "5"
          wait-max-delay-seconds: "15"
          force-new-deployment: "false"
          enable-ecs-managed-tags: "false"
          propagate-tags: "SERVICE"
          max-retries: "1"

      - name: Assert action failed at AWS API (not at input parsing)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # The action should fail at the AWS API call (fake credentials),
          # meaning it successfully parsed all service deployment inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no real AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: '$OUTCOME'"
            exit 1
          fi
