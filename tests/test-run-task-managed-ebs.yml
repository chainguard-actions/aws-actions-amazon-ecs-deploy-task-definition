name: Test run-task managed EBS volume inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: tests/fixtures/task-definition.json
          run-task: "true"
          run-task-managed-ebs-volume-name: "my-task-ebs-volume"
          run-task-managed-ebs-volume: '{"sizeInGiB":10,"volumeType":"gp3","encrypted":false}'
          run-task-started-by: "GitHub-Actions-Test"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action ran (failed gracefully at AWS API level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_DEF_ARN: ${{ steps.action.outputs.task-definition-arn }}
          RUN_TASK_ARN: ${{ steps.action.outputs.run-task-arn }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition-arn: $TASK_DEF_ARN"
          echo "run-task-arn: $RUN_TASK_ARN"
          # The action should fail at the AWS API call level (no real credentials),
          # not at input parsing or file loading.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_ARN" ]; then
              echo "FAIL: action succeeded but task-definition-arn output is empty"
              exit 1
            fi
            echo "PASS: task registered with ARN: $TASK_DEF_ARN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
