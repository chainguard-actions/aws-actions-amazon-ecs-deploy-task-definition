name: Test CodeDeploy ECS deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal task definition file
        run: |
          cat > /tmp/task-definition.json << 'EOF'
          {
            "family": "test-task",
            "containerDefinitions": [
              {
                "name": "test-container",
                "image": "nginx:latest",
                "memory": 128,
                "cpu": 64
              }
            ]
          }
          EOF

      - name: Create minimal appspec file
        run: |
          cat > /tmp/appspec.yaml << 'EOF'
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: <TASK_DEFINITION>
                  LoadBalancerInfo:
                    ContainerName: test-container
                    ContainerPort: 80
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/task-definition.json
          service: my-codedeploy-service
          cluster: my-cluster
          codedeploy-appspec: /tmp/appspec.yaml
          codedeploy-application: AppECS-my-cluster-my-codedeploy-service
          codedeploy-deployment-group: DgpECS-my-cluster-my-codedeploy-service
          codedeploy-deployment-description: "Test deployment from GitHub Actions"
          codedeploy-deployment-config: CodeDeployDefault.ECSAllAtOnce
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key

      - name: Assert action ran (may fail due to no real AWS)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (AWS errors expected without real credentials)"
