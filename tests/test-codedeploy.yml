name: Test CodeDeploy deployment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
          AWS_DEFAULT_REGION: us-east-1
        with:
          task-definition: ${{ github.workspace }}/actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.2/tests/fixtures/task-definition.json
          service: my-codedeploy-service
          cluster: my-codedeploy-cluster
          codedeploy-appspec: ${{ github.workspace }}/actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.2/tests/fixtures/appspec.yaml
          codedeploy-application: AppECS-my-codedeploy-cluster-my-codedeploy-service
          codedeploy-deployment-group: DgpECS-my-codedeploy-cluster-my-codedeploy-service
          codedeploy-deployment-description: "Test deployment from GitHub Actions"
          codedeploy-deployment-config: CodeDeployDefault.ECSAllAtOnce
      - name: Assert action ran (expected to fail due to no real AWS)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with expected outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
