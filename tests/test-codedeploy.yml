name: Test CodeDeploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture files
        run: |
          cp $GITHUB_WORKSPACE/actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.1/tests/fixtures/task-definition.json /tmp/task-definition.json
          cp $GITHUB_WORKSPACE/actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.1/tests/fixtures/appspec.yaml /tmp/appspec.yaml
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
          AWS_DEFAULT_REGION: us-east-1
        with:
          task-definition: /tmp/task-definition.json
          service: my-codedeploy-service
          cluster: my-cluster
          codedeploy-appspec: /tmp/appspec.yaml
          codedeploy-application: AppECS-my-cluster-my-codedeploy-service
          codedeploy-deployment-group: DgpECS-my-cluster-my-codedeploy-service
          codedeploy-deployment-description: "Test deployment from GitHub Actions"
          codedeploy-deployment-config: CodeDeployDefault.ECSAllAtOnce
      - name: Assert action ran (may fail due to no real AWS creds)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
