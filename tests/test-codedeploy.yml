name: Test CodeDeploy deployment controller inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal AppSpec file
        run: |
          cat > /tmp/appspec.yaml << 'EOF'
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: <TASK_DEFINITION>
                  LoadBalancerInfo:
                    ContainerName: "my-container"
                    ContainerPort: 80
          EOF
          cp /tmp/appspec.yaml "$GITHUB_WORKSPACE/tests/fixtures/appspec.yaml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: tests/fixtures/task-definition.json
          service: my-ecs-service
          cluster: my-ecs-cluster
          codedeploy-appspec: tests/fixtures/appspec.yaml
          codedeploy-application: AppECS-my-cluster-my-service
          codedeploy-deployment-group: DgpECS-my-cluster-my-service
          codedeploy-deployment-description: "Test deployment from GitHub Actions"
          codedeploy-deployment-config: CodeDeployDefault.ECSAllAtOnce
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action ran (failed gracefully at AWS API level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_DEF_ARN: ${{ steps.action.outputs.task-definition-arn }}
          CODEDEPLOY_ID: ${{ steps.action.outputs.codedeploy-deployment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition-arn: $TASK_DEF_ARN"
          echo "codedeploy-deployment-id: $CODEDEPLOY_ID"
          # The action should fail at the AWS API call level (no real credentials),
          # not at input parsing or file loading.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_ARN" ]; then
              echo "FAIL: action succeeded but task-definition-arn output is empty"
              exit 1
            fi
            echo "PASS: task registered with ARN: $TASK_DEF_ARN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
