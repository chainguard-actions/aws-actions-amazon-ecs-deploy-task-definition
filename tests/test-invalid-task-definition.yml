name: Test invalid task definition content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid task definition file
        run: |
          echo "{ this is not valid json or yaml :" > "$GITHUB_WORKSPACE/invalid-task-def.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: invalid-task-def.json

      - name: Assert action failed due to invalid task definition
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when task definition file has invalid content"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when task definition file is invalid"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
