name: Test basic ECS deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal task definition file
        run: |
          cat > /tmp/task-definition.json << 'EOF'
          {
            "family": "test-task",
            "containerDefinitions": [
              {
                "name": "test-container",
                "image": "nginx:latest",
                "memory": 128,
                "cpu": 64
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/task-definition.json
          service: my-service
          cluster: my-cluster
          wait-for-service-stability: "false"
          wait-for-minutes: "5"
          desired-count: "1"
          force-new-deployment: "false"
          enable-ecs-managed-tags: "false"
          propagate-tags: "SERVICE"
          keep-null-value-keys: ""
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key

      - name: Assert action ran (may fail due to no real AWS)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (AWS errors expected without real credentials)"
