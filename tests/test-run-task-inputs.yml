name: Test run-task inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create task definition file
        run: |
          mkdir -p /tmp/test-fixtures
          cat > /tmp/test-fixtures/task-def-run-task.json << 'EOF'
          {
            "family": "test-run-task-family",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "volumes": [
              {
                "name": "my-ebs-volume",
                "configuredAtLaunch": true
              }
            ],
            "containerDefinitions": [
              {
                "name": "test-container",
                "image": "nginx:latest",
                "essential": true
              }
            ]
          }
          EOF

      - name: Run action with run-task inputs
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
        with:
          task-definition: /tmp/test-fixtures/task-def-run-task.json
          run-task: "true"
          run-task-container-overrides: '[{"name":"test-container","environment":[{"name":"MY_VAR","value":"my-value"}]}]'
          run-task-security-groups: "sg-12345678"
          run-task-subnets: "subnet-12345678"
          run-task-assign-public-IP: "DISABLED"
          run-task-launch-type: "FARGATE"
          run-task-started-by: "GitHub-Actions-Test"
          run-task-tags: '[{"key":"Environment","value":"test"}]'
          run-task-managed-ebs-volume-name: "my-ebs-volume"
          run-task-managed-ebs-volume: '{"sizeInGiB":20,"volumeType":"gp3"}'
          wait-for-task-stopped: "false"
          max-retries: "1"

      - name: Assert action failed at AWS API (not at input parsing)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # The action should fail at the AWS API call (fake credentials),
          # meaning it successfully parsed all run-task inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no real AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: '$OUTCOME'"
            exit 1
          fi
