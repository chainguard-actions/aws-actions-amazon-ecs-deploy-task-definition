name: Test run standalone task
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture task definition
        run: |
          cp $GITHUB_WORKSPACE/actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.0/tests/fixtures/task-definition.json /tmp/task-definition.json

      - name: Run action with run-task inputs (expect AWS credential failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
        with:
          task-definition: /tmp/task-definition.json
          run-task: "true"
          run-task-container-overrides: '[{"name":"test-container","command":["echo","hello"]}]'
          run-task-security-groups: "sg-12345678"
          run-task-subnets: "subnet-12345678"
          run-task-assign-public-IP: "ENABLED"
          run-task-capacity-provider-strategy: '[{"capacityProvider":"FARGATE_SPOT","weight":1}]'
          run-task-launch-type: "FARGATE"
          run-task-started-by: "GitHub-Actions-Test"
          run-task-tags: '[{"key":"Environment","value":"test"}]'
          run-task-managed-ebs-volume-name: "my-task-ebs-volume"
          run-task-managed-ebs-volume: '{"sizeInGiB":10,"volumeType":"gp3"}'
          wait-for-task-stopped: "true"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
