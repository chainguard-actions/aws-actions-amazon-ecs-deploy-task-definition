name: Test run-task ECS inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal task definition file
        run: |
          cat > /tmp/task-definition.json << 'EOF'
          {
            "family": "test-task",
            "containerDefinitions": [
              {
                "name": "test-container",
                "image": "nginx:latest",
                "memory": 128,
                "cpu": 64
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/task-definition.json
          run-task: "true"
          run-task-container-overrides: '[{"name":"test-container","environment":[{"name":"MY_VAR","value":"my-value"}]}]'
          run-task-security-groups: "sg-12345678"
          run-task-subnets: "subnet-12345678"
          run-task-assign-public-IP: "DISABLED"
          run-task-capacity-provider-strategy: '[{"capacityProvider":"FARGATE","weight":1}]'
          run-task-launch-type: "FARGATE"
          run-task-started-by: "GitHub-Actions"
          run-task-tags: '[{"key":"Environment","value":"test"}]'
          run-task-managed-ebs-volume-name: "my-ebs-volume"
          run-task-managed-ebs-volume: '{"sizeInGiB":20,"volumeType":"gp3"}'
          wait-for-task-stopped: "false"
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key

      - name: Assert action ran (may fail due to no real AWS)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (AWS errors expected without real credentials)"
