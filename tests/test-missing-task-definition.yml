name: Test missing task definition file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent task definition file
        id: action
        uses: .
        with:
          task-definition: non-existent-task-definition.json
        continue-on-error: true

      - name: Assert action failed due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when task definition file does not exist, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when task definition file was missing"
