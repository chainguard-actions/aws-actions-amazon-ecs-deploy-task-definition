name: Test ECS deploy - missing required task-definition input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a placeholder (task-definition path points to non-existent file)
        run: |
          echo "Testing with a non-existent task definition file path"

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/nonexistent-task-def.json
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key

      - name: Assert action fails when task definition file does not exist
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when task definition file does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with a non-existent task definition file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
