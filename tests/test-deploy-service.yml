name: Test deploy to ECS service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture task definition
        run: |
          cp $GITHUB_WORKSPACE/actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.0/tests/fixtures/task-definition.json /tmp/task-definition.json

      - name: Run action (expect AWS credential failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
        with:
          task-definition: /tmp/task-definition.json
          service: my-ecs-service
          cluster: my-ecs-cluster
          desired-count: "2"
          wait-for-service-stability: "true"
          wait-for-minutes: "5"
          force-new-deployment: "true"
          enable-ecs-managed-tags: "true"
          propagate-tags: "SERVICE"
          service-managed-ebs-volume-name: "my-ebs-volume"
          service-managed-ebs-volume: '{"sizeInGiB":20,"volumeType":"gp3"}'

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
