name: Test task definition with ignored ECS attributes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action correctly strips ECS-returned attributes
      # (taskDefinitionArn, revision, status, compatibilities, requiresAttributes,
      # registeredAt, registeredBy) from the task definition before registering.
      # This is a key feature: users can copy-paste the output of DescribeTaskDefinition.
      # Without real AWS credentials, it will fail at the AWS API call,
      # but we verify the failure is at the API layer (not file/parse error).
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          task-definition: tests/fixtures/task-definition-with-ignored-attrs.json

      - name: Assert action failed at AWS layer (not file/parse layer)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without real AWS credentials"
            exit 1
          fi
          echo "PASS: task definition with ignored attributes was parsed; action failed at AWS API layer as expected"
