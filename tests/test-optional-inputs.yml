name: Test optional inputs (desired-count, keep-null-value-keys, force-new-deployment)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ECS task definition with null/empty fields
        run: |
          cat > /tmp/task-def-optional.json << 'EOF'
          {
            "family": "test-optional-task",
            "containerDefinitions": [
              {
                "name": "app",
                "image": "nginx:latest",
                "cpu": 256,
                "memory": 512,
                "essential": true,
                "environment": [],
                "secrets": []
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "networkMode": "awsvpc",
            "cpu": "256",
            "memory": "512",
            "tags": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/task-def-optional.json
          service: my-service
          cluster: my-cluster
          desired-count: "2"
          force-new-deployment: "true"
          wait-for-service-stability: "false"
          keep-null-value-keys: "environment,secrets,tags"
          max-retries: "1"

      - name: Assert action ran (deployed or failed gracefully without AWS creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_DEF_ARN: ${{ steps.action.outputs.task-definition-arn }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition-arn: $TASK_DEF_ARN"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_ARN" ]; then
              echo "FAIL: action succeeded but task-definition-arn output is empty"
              exit 1
            fi
            echo "PASS: task registered with ARN: $TASK_DEF_ARN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
