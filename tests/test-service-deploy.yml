name: Test ECS service deployment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal ECS task definition file
        run: |
          cat > /tmp/service-task-def.json << 'EOF'
          {
            "family": "test-service-task",
            "containerDefinitions": [
              {
                "name": "test-container",
                "image": "nginx:latest",
                "cpu": 256,
                "memory": 512,
                "essential": true
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "networkMode": "awsvpc",
            "cpu": "256",
            "memory": "512"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/service-task-def.json
          service: my-test-service
          cluster: my-test-cluster
          desired-count: "1"
          wait-for-service-stability: "false"
          wait-for-minutes: "5"
          wait-max-delay-seconds: "15"
          force-new-deployment: "false"
          enable-ecs-managed-tags: "true"
          propagate-tags: SERVICE
          max-retries: "3"

      - name: Assert action ran (succeeded with AWS creds, or failed gracefully without)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_DEF_ARN: ${{ steps.action.outputs.task-definition-arn }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition-arn: $TASK_DEF_ARN"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_ARN" ]; then
              echo "FAIL: action succeeded but task-definition-arn output is empty"
              exit 1
            fi
            echo "PASS: task registered and service updated, ARN=$TASK_DEF_ARN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
