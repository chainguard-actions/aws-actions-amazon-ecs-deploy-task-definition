name: Test service deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test-key-id
          AWS_SECRET_ACCESS_KEY: test-secret-key
        with:
          task-definition: actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.3/tests/fixtures/task-definition.json
          service: my-test-service
          cluster: my-test-cluster
          desired-count: "2"
          wait-for-service-stability: "true"
          wait-for-minutes: "5"
          wait-max-delay-seconds: "15"
          force-new-deployment: "true"
          enable-ecs-managed-tags: "true"
          propagate-tags: "SERVICE"
          max-retries: "1"

      - name: Assert action completed (failed at AWS API as expected with fake credentials)
        if: always()
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # The action should fail because of invalid AWS credentials,
          # not because of a missing or malformed task definition file.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no real AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: '$OUTCOME'"
            exit 1
          fi
