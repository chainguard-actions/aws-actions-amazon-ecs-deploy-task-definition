name: Test YAML task definition format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action can read and parse a YAML-format task definition.
      # Without real AWS credentials, it will fail at the AWS API call,
      # but we verify the failure is at the API layer (not file/parse error).
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-west-2
        with:
          task-definition: tests/fixtures/task-definition.yaml

      - name: Assert action failed at AWS layer (not file/parse layer)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without real AWS credentials"
            exit 1
          fi
          echo "PASS: YAML task definition was parsed; action failed at AWS API layer as expected"
