name: Test YAML format task definition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a YAML task definition file
        run: |
          mkdir -p /tmp/test-fixtures
          cat > /tmp/test-fixtures/task-def.yaml << 'EOF'
          family: test-yaml-task-family
          networkMode: awsvpc
          requiresCompatibilities:
            - FARGATE
          cpu: "256"
          memory: "512"
          containerDefinitions:
            - name: test-container
              image: nginx:latest
              essential: true
              portMappings:
                - containerPort: 80
                  protocol: tcp
          EOF

      - name: Run action with YAML task definition
        id: action
        uses: .
        with:
          task-definition: /tmp/test-fixtures/task-def.yaml
        env:
          AWS_DEFAULT_REGION: us-east-1
        continue-on-error: true

      - name: Assert action failed at AWS API (not at YAML parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the AWS API call (no credentials),
          # meaning it successfully parsed the YAML task definition.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at AWS API), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly parsed YAML task definition and failed at AWS API stage"
