name: Test ECS deploy - CodeDeploy controller inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create task definition file
        run: |
          cat > /tmp/codedeploy-task-def.json << 'EOF'
          {
            "family": "test-codedeploy-task",
            "containerDefinitions": [
              {
                "name": "web",
                "image": "nginx:latest",
                "cpu": 256,
                "memory": 512,
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 80,
                    "protocol": "tcp"
                  }
                ]
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "networkMode": "awsvpc",
            "cpu": "256",
            "memory": "512"
          }
          EOF

      - name: Create CodeDeploy AppSpec file
        run: |
          cat > /tmp/appspec.yaml << 'EOF'
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: <TASK_DEFINITION>
                  LoadBalancerInfo:
                    ContainerName: "web"
                    ContainerPort: 80
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          task-definition: /tmp/codedeploy-task-def.json
          service: my-codedeploy-service
          cluster: my-cluster
          codedeploy-appspec: /tmp/appspec.yaml
          codedeploy-application: AppECS-my-cluster-my-codedeploy-service
          codedeploy-deployment-group: DgpECS-my-cluster-my-codedeploy-service
          codedeploy-deployment-description: "Test deployment from GitHub Actions"
          codedeploy-deployment-config: CodeDeployDefault.ECSAllAtOnce
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key

      - name: Assert action ran (CodeDeploy inputs, expect graceful failure without real AWS creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_DEF_ARN: ${{ steps.action.outputs.task-definition-arn }}
          CODEDEPLOY_ID: ${{ steps.action.outputs.codedeploy-deployment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task-definition-arn: $TASK_DEF_ARN"
          echo "codedeploy-deployment-id: $CODEDEPLOY_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_DEF_ARN" ]; then
              echo "FAIL: action succeeded but task-definition-arn output is empty"
              exit 1
            fi
            echo "PASS: CodeDeploy deployment initiated, ARN=$TASK_DEF_ARN, deployment-id=$CODEDEPLOY_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real AWS credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
