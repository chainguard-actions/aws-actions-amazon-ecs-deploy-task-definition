name: Test service-managed EBS volume inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test-key-id
          AWS_SECRET_ACCESS_KEY: test-secret-key
        with:
          task-definition: actions/hardened/aws-actions--amazon-ecs-deploy-task-definition/v2.6.3/tests/fixtures/task-definition.json
          service: my-ebs-service
          cluster: my-ebs-cluster
          service-managed-ebs-volume-name: "my-service-ebs-volume"
          service-managed-ebs-volume: '{"sizeInGiB":30,"volumeType":"gp3","iops":3000,"throughput":125}'
          max-retries: "1"

      - name: Assert action completed (failed at AWS API as expected with fake credentials)
        if: always()
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # The action should fail because of invalid AWS credentials,
          # not because of a missing or malformed task definition file.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no real AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: '$OUTCOME'"
            exit 1
          fi
