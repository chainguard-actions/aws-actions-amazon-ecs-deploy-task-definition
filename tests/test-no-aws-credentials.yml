name: Test task definition registration without AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid task definition but no AWS credentials
        id: action
        uses: .
        with:
          task-definition: tests/fixtures/task-definition.json
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_DEFAULT_REGION: us-east-1
        continue-on-error: true

      - name: Assert action failed at AWS API call (not at file reading)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it cannot authenticate with AWS,
          # but it should have successfully read and parsed the task definition file.
          # A failure here means the action reached the AWS API call stage.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing AWS credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when AWS credentials were not configured"
